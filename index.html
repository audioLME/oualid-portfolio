<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Oualid Meghlaoui — Architect, Designer &amp; 3D Artist</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Portfolio of Oualid Meghlaoui — architect, designer and 3D artist based in Algeria." />
  <meta name="theme-color" content="#eee9e4" />
  <meta property="og:type" content="website" />
  <meta property="og:title" content="Oualid Meghlaoui — Architect, Designer &amp; 3D Artist" />
  <meta property="og:description" content="Portfolio of Oualid Meghlaoui — architect, designer and 3D artist based in Algeria." />
  <meta name="twitter:card" content="summary" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%23111'/%3E%3Ctext x='16' y='23' font-size='20' font-family='sans-serif' font-weight='900' text-anchor='middle' fill='%23eee9e4'%3EO%3C/text%3E%3C/svg%3E" />
  <link rel="preload" href="fonts/konnect/KonnectBlack.otf" as="font" type="font/otf" crossorigin />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Kufi+Arabic:wght@300;400;500;700;900&display=swap" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body data-page="home">

    <!-- Background Lines Grid -->
    <div id="bg-lines"></div>
    <svg id="shape-overlay" style="position: fixed; inset: 0; pointer-events: none; z-index: 0;"></svg>
    <div id="bg-highlight"></div>

    <!-- Loading Overlay -->
    <div id="loading-overlay"></div>

    <!-- Version Indicator -->
    <div id="version-indicator">v0.0.00</div>

  <!-- HEADER -->
  <header class="site-header">
    <a href="/" class="logo" aria-label="Oualid Meghlaoui — home"><span>O</span><span>U</span><span>A</span><span>L</span><span>I</span><span>D</span><span>&nbsp;</span><span>M</span><span>E</span><span>G</span><span>H</span><span>L</span><span>A</span><span>O</span><span>U</span><span>I</span></a>

    <nav class="nav" data-i18n-label="nav.label">
      <a href="profile.html" data-page="profile" data-i18n="nav.resume">RESUME</a>
      <a href="portfolio.html" data-page="portfolio" data-i18n="nav.portfolio">PORTFOLIO</a>
      <a href="contact.html" data-page="contact" data-i18n="nav.contact">CONTACT</a>
    </nav>

    <div class="meta" id="time-display">Algeria&nbsp;&nbsp;&nbsp;<svg class="hourglass" width="12" height="15" viewBox="0 0 16 20" fill="none" xmlns="http://www.w3.org/2000/svg">
  <polygon points="0,0 16,0 8,10" fill="#111"/>
  <polygon points="8,10 0,20 16,20" fill="#111"/>
</svg></div>
  </header>

  <!-- HERO -->
  <main class="hero">
    <h1 class="sr-only">Oualid Meghlaoui — Architect, Designer and 3D Artist</h1>
    <div class="hero-words">
      <div id="animation-box"></div>
      <div id="subtitle-box"></div>
    </div>

    <section class="hero-text">
      <h2 id="hero-heading"></h2>
      <button id="continue-arrow" class="continue-btn" type="button" aria-label="Continue to profile" data-i18n-label="hero.continueLabel">
        <span class="continue-text" data-i18n="hero.continue">CONTINUE</span>
        <svg class="arrow-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M8 3L3 3L3 8M16 3L21 3L21 8M21 16L21 21L16 21M3 16L3 21L8 21" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </button>
    </section>
  </main>

  <!-- GSAP -->
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
  <script src="i18n.js"></script>
  <script src="common.js"></script>
  <script src="hero.js"></script>
  <script src="shapes.js"></script>
  <script>
    // Entry animation
    const entryTl = gsap.timeline();
    entryTl.to('#loading-overlay', { top: '100%', duration: 1, ease: 'power2.inOut' })
      .to({}, { duration: 0.8 }) // delay to show empty background
      .fromTo('.logo', { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.5 })
      .fromTo('.nav a', { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.5, stagger: 0.2 }, '-=0.3')
      .fromTo('.header-end > *', { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.5, stagger: 0.15 }, '-=0.25')
      .call(Site.startLogoFlip)
      .to('#animation-box', { opacity: 1, duration: 0.5 }, '+=0.2')
      .fromTo('.letter', { y: 300, opacity: 0 }, { y: 0, opacity: 1, duration: 0.9, stagger: 0.08, ease: 'power4.out' })
      .to('#subtitle-box', { opacity: 1, duration: 0.3 }, '-=0.3')
      .call(() => {
        // Type in MEGHLAOUI after OUALID appears
        if (typeof showSubtitle === 'function') {
          showSubtitle();
        }
      })
      .to('.hero-text', { opacity: 1, duration: 0 }, '+=0.5')
      .call(() => {
        // Animate hero text letter by letter
        if (typeof animateHeroText === 'function') {
          animateHeroText();
        }
      }, null, '+=0.5')
      .to('.continue-btn', { opacity: 1, duration: 0.8, ease: 'power2.out' }, '+=4')
      .call(() => {
        // Start cycling after OUALID has been shown for 2.5s
        if (typeof startCycle === 'function') {
          gsap.delayedCall(2.5, startCycle);
        }
      });

    Site.initGridHighlight();

    // Continue button expand animation
    document.getElementById('continue-arrow').addEventListener('click', (e) => {
      e.stopPropagation(); // Prevent grid flip
      
      const btn = e.currentTarget;
      Site.cutTo('profile.html');

      // Fade out button
      gsap.to(btn, {
        opacity: 0,
        duration: 0.6,
        ease: 'power2.out'
      });
    });
  </script>
</body>
</html>
