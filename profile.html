<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Profile — Oualid Meghlaoui</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Profile of Oualid Meghlaoui — architect, designer and 3D artist." />
  <meta name="theme-color" content="#111111" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%23111'/%3E%3Ctext x='16' y='23' font-size='20' font-family='sans-serif' font-weight='900' text-anchor='middle' fill='%23eee9e4'%3EO%3C/text%3E%3C/svg%3E" />
  <link rel="stylesheet" href="styles.css" />
  <style>
    body {
      background: #111 !important;
      color: #eee9e4 !important;
    }

    /* let the document scroll normally once the profile has real content */
    html, body {
      height: auto;
      min-height: 100%;
    }

    .site-header {
      background: #111 !important;
    }
    .logo,
    .nav a,
    .meta {
      color: #eee9e4 !important;
    }
    .hourglass polygon {
      fill: #eee9e4 !important;
    }
    #version-indicator {
      color: #eee9e4 !important;
    }
    .site-header {
      transform: translateY(-100px);
    }
    /* 3D scene: perspective lives on a fixed wrapper, not on <body> */
    #scene {
      position: fixed;
      inset: 0;
      perspective: 1400px;
      perspective-origin: 50% 38%;
      pointer-events: none;
      z-index: 0;
    }
    #grid-container {
      position: absolute;
      inset: 0;
      transform-style: preserve-3d;
    }
    #grid-container .grid-plane {
      position: absolute;
      left: 50%;
      top: 50%;
      opacity: 0;
    }
    .about-content h1,
    .about-content p {
      color: #eee9e4 !important;
    }
    .about-page {
      position: relative;
      z-index: 2;
      padding: 140px 48px 80px;
    }
    .about-content {
      opacity: 0;
    }
    @media (max-width: 768px) {
      .about-page { padding: 200px 24px 64px; }
    }
    .nav a {
      border: 1px solid rgba(238, 233, 228, 0.06);
      padding: 8px 12px;
      transition: background-color 0.35s ease, color 0.35s ease, border-color 0.35s ease;
      cursor: pointer;
    }
    .nav a.inverted {
      background-color: #eee9e4;
      color: #111 !important;
      border-color: #eee9e4;
    }
  </style>
</head>
<body>

  <!-- 3D Grid Space -->
  <div id="scene" aria-hidden="true"><div id="grid-container"></div></div>

    <!-- Version Indicator -->
    <div id="version-indicator">v0.0.00</div>

  <!-- HEADER -->
  <header class="site-header">
    <a href="/" class="logo" aria-label="Oualid Meghlaoui — home"><span>O</span><span>U</span><span>A</span><span>L</span><span>I</span><span>D</span><span>&nbsp;</span><span>M</span><span>E</span><span>G</span><span>H</span><span>L</span><span>A</span><span>O</span><span>U</span><span>I</span></a>

    <nav class="nav">
      <a href="#">RESUME</a>
      <a href="#">PORTFOLIO</a>
      <a href="#">CONTACT</a>
    </nav>

    <div class="meta" id="time-display">Algeria&nbsp;&nbsp;&nbsp;<svg class="hourglass" width="12" height="15" viewBox="0 0 16 20" fill="none" xmlns="http://www.w3.org/2000/svg">
  <polygon points="0,0 16,0 8,10" fill="#111"/>
  <polygon points="8,10 0,20 16,20" fill="#111"/>
</svg></div>
  </header>

  <!-- PROFILE CONTENT -->
  <main class="about-page">
    <section class="about-content">
      <h1>Profile</h1>
      <p>Content goes here...</p>
    </section>
  </main>

  <!-- GSAP -->
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
  <script src="3Dshapes.js"></script>
  <script src="holograms.js"></script>
  <script>
    init3DRoomGrid();
    // Fetch version from Vercel deployments, fallback to GitHub
    async function updateVersion() {
      try {
        // Try Vercel API first
        const response = await fetch('/api/deployments');
        if (!response.ok) throw new Error('deployments API ' + response.status);
        const data = await response.json();
        if (data.version) {
          document.getElementById('version-indicator').textContent = data.version;
          return;
        }
      } catch (error) {
        console.log('Vercel API failed, trying GitHub...');
      }

      // Fallback to GitHub commits
      try {
        const response = await fetch('https://api.github.com/repos/audiolME/oualid-portfolio/commits?per_page=1');
        const linkHeader = response.headers.get('Link');
        let commitCount = 1;
        
        if (linkHeader) {
          const match = linkHeader.match(/page=(\d+)>; rel="last"/);
          if (match) commitCount = parseInt(match[1]);
        }
        
        const minor = Math.floor(commitCount / 100);
        const patch = (commitCount % 100).toString().padStart(2, '0');
        const version = `v0.${minor}.${patch}`;
        
        document.getElementById('version-indicator').textContent = version;
      } catch (error) {
        console.log('Version fetch failed');
      }
    }
    updateVersion();

    function updateTime() {
      const now = new Date();
      const timeString = now.toLocaleString('en-US', {timeZone: 'Africa/Algiers', hour12: true, hour: 'numeric', minute: '2-digit'});
      const dateString = now.toLocaleString('en-US', {timeZone: 'Africa/Algiers', month: 'short', day: 'numeric', year: 'numeric'});
      document.getElementById('time-display').innerHTML = `Algeria\u00A0\u00A0\u00A0<svg class="hourglass" width="12" height="15" viewBox="0 0 16 20" fill="none" xmlns="http://www.w3.org/2000/svg">
  <polygon points="0,0 16,0 8,10" fill="#eee9e4"/>
  <polygon points="8,10 0,20 16,20" fill="#eee9e4"/>
</svg>\u00A0\u00A0\u00A0${timeString}\u00A0\u00A0\u00A0${dateString}`;
    }
    updateTime();
    setInterval(updateTime, 60000);

    // Entry animation (no loading overlay)
    const entryTl = gsap.timeline();
    
    entryTl
      .fromTo('#grid-container', { z: -420 }, { z: 0, duration: 1.6, ease: 'power3.out' }, 0)
      .to('.grid-plane.floor',      { opacity: 1, duration: 0.8, ease: 'power2.out' }, 0)
      .to('.grid-plane.ceiling',    { opacity: 1, duration: 0.8, ease: 'power2.out' }, 0.12)
      .to('.grid-plane.wall-left',  { opacity: 1, duration: 0.8, ease: 'power2.out' }, 0.24)
      .to('.grid-plane.wall-right', { opacity: 1, duration: 0.8, ease: 'power2.out' }, 0.36)
      .to('.grid-plane.wall-back',  { opacity: 1, duration: 0.8, ease: 'power2.out' }, 0.48)
      .to('.site-header', { y: 0, duration: 1.8, ease: 'power2.out' }, 0.6)
      .call(() => {
        const logoTl = gsap.timeline({ repeat: -1 });
        logoTl.to('.logo span', { rotationY: 180, duration: 0.5, stagger: 0.1 }, 0)
          .to('.logo span', { rotationY: 0, duration: 0.5, stagger: 0.1 }, 0.5)
          .to({}, { duration: 4 }, 1);
      }, null, 0.9)
      .fromTo('.about-content', { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: 0.8, ease: 'power2.out' }, 1.6)
      .call(() => { if (typeof initHolograms === 'function') initHolograms(); }, null, 2.0);

    // Nav link invert effect
    document.querySelectorAll('.nav a').forEach(link => {
      link.addEventListener('click', (e) => {
        e.preventDefault();
        
        if (link.classList.contains('inverted')) {
          link.classList.remove('inverted');
        } else {
          // Remove inverted from other links
          document.querySelectorAll('.nav a.inverted').forEach(other => {
            if (other !== link) other.classList.remove('inverted');
          });
          link.classList.add('inverted');
        }
      });
    });
  </script>
</body>
</html>
